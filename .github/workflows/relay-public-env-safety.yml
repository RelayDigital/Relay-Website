name: Relay production environment safety
on:
  pull_request:
    paths:
      - "relay-headless/**"
      - ".github/workflows/relay-public-env-safety.yml"
  workflow_dispatch:
jobs:
  safety-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay-headless/package-lock.json
      - run: node --test tests/public-env-safety.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
